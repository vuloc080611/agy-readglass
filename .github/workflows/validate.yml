name: Validate Clearframe Pack & Skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify packs sync
        run: python tools/sync_packs.py --check

      - name: Verify skill bundles sync
        run: python tools/bundle_skills.py --check

      - name: Verify SVG swatches and Web Studio sync
        run: python tools/render_swatches.py --check

      - name: Run contrast, APCA, and ergonomic gate
        run: |
          {
            echo "### Clearframe Contrast & APCA Report"
            echo '```text'
            python tools/check_contrast.py --apca --strict-ergo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
